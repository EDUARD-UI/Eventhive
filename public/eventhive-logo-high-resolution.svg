<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc">
  <title id="title">EVENTHIVE</title>
  <desc id="desc">Logo de EventHive con siete hexágonos azules y dorados, y un boleto cultural en el centro.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39a9e8"/>
      <stop offset=".48" stop-color="#0878bd"/>
      <stop offset="1" stop-color="#073b78"/>
    </linearGradient>
    <linearGradient id="blueDeep" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1d8bd0"/>
      <stop offset="1" stop-color="#063c78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe17a"/>
      <stop offset=".48" stop-color="#f5b52b"/>
      <stop offset="1" stop-color="#b86b08"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#063e7e"/>
      <stop offset=".62" stop-color="#126eae"/>
      <stop offset="1" stop-color="#efb52b"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#073b78"/>
      <stop offset=".6" stop-color="#0878bd"/>
      <stop offset="1" stop-color="#1b93d8"/>
    </linearGradient>
    <pattern id="honeycomb" width="42" height="72" patternUnits="userSpaceOnUse">
      <path d="M21 2 39 12v21L21 43 3 33V12Z M21 74 39 64V43L21 33 3 43v21Z" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#082b50" flood-opacity=".22"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="hex" d="M0-132 114-66v132L0 132-114 66V-66Z"/>
    <path id="ticketShape" d="M-220-112h370a34 34 0 0 1 34 34v28a28 28 0 1 0 0 56v28a34 34 0 0 1-34 34h-370a34 34 0 0 1-34-34v-28a28 28 0 1 0 0-56v-28a34 34 0 0 1 34-34Z"/>
  </defs>

  <rect width="1400" height="1280" fill="#fff"/>

  <g transform="translate(700 330)" filter="url(#shadow)" stroke="#fff" stroke-width="8" stroke-linejoin="round">
    <g transform="translate(-270 -165)"><use href="#hex" fill="url(#blue)"/><path d="M-86-70 0-116 86-70" fill="none" stroke="#bfeaff" stroke-opacity=".75" stroke-width="8"/></g>
    <g transform="translate(0 -165)"><use href="#hex" fill="url(#blue)"/><path d="M-86-70 0-116 86-70" fill="none" stroke="#bfeaff" stroke-opacity=".75" stroke-width="8"/></g>
    <g transform="translate(270 -165)"><use href="#hex" fill="url(#blue)"/><path d="M-86-70 0-116 86-70" fill="none" stroke="#bfeaff" stroke-opacity=".75" stroke-width="8"/></g>
    <g transform="translate(0 100)"><use href="#hex" fill="url(#blueDeep)"/></g>
    <g transform="translate(-270 365)"><use href="#hex" fill="url(#gold)"/><path d="M-86 70 0 116 86 70" fill="none" stroke="#fff0a8" stroke-opacity=".85" stroke-width="8"/></g>
    <g transform="translate(0 365)"><use href="#hex" fill="url(#gold)"/><path d="M-86 70 0 116 86 70" fill="none" stroke="#fff0a8" stroke-opacity=".85" stroke-width="8"/></g>
    <g transform="translate(270 365)"><use href="#hex" fill="url(#gold)"/><path d="M-86 70 0 116 86 70" fill="none" stroke="#fff0a8" stroke-opacity=".85" stroke-width="8"/></g>
  </g>

  <g transform="translate(700 435) rotate(-22)" filter="url(#shadow)">
    <use href="#ticketShape" fill="#031f48" opacity=".35" transform="translate(12 18)"/>
    <use href="#ticketShape" fill="url(#ticket)" stroke="#fff" stroke-width="8"/>
    <use href="#ticketShape" fill="url(#honeycomb)" opacity=".7"/>
    <use href="#ticketShape" fill="none" stroke="#f9d66b" stroke-opacity=".8" stroke-width="5" transform="scale(.91)"/>
    <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <path d="m-5-55 16 39 42 4-32 27 10 41-36-22-36 22 10-41-32-27 42-4Z" stroke="#fff4bb" stroke-width="4"/>
      <path d="M-155-57v42m0-42 32-9v38m-32-16 32-9" fill="none" stroke-width="10"/>
      <circle cx="-155" cy="-15" r="9" stroke="none"/><circle cx="-123" cy="-28" r="9" stroke="none"/>
      <circle cx="-82" cy="-66" r="10" stroke="none"/><circle cx="-51" cy="-67" r="10" stroke="none"/>
      <path d="M-82-53v32l-18 25m18-20 20 13m11-45v20l24 25m-24-25-20 8" fill="none" stroke-width="8"/>
      <rect x="96" y="-73" width="32" height="65" rx="3" stroke="none"/>
      <path d="m88-73 24-25 24 25M91-8h42M93 5h38M112-105v-16" fill="none" stroke-width="8"/>
      <circle cx="112" cy="-45" r="10" fill="#1764a5" stroke="none"/>
      <rect x="-143" y="27" width="12" height="42" rx="6" stroke="none"/><path d="M-158 48c0 22 30 22 30 0m-15 22v13m-13 0h26" fill="none" stroke-width="7"/>
      <path d="m-90 31h38l-19 22Zm19 22v28m-14 0h28" fill="none" stroke-width="7"/>
      <path d="m-12 43 11-10h20l11 10v28H-12Z" stroke-width="7" fill="none"/><circle cx="9" cy="57" r="8" fill="#e3a622" stroke="none"/>
    </g>
    <path d="M150-90 175-65" stroke="#fff" stroke-opacity=".7" stroke-width="9" filter="url(#glow)"/>
  </g>

  <text x="700" y="1110" text-anchor="middle" fill="url(#wordmark)" font-family="Arial, Helvetica, sans-serif" font-size="124" font-weight="800" letter-spacing="14">EVENTHIVE</text>
</svg>